<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WFX Smart</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark">W</span>
        <div>
          <strong>WFX Smart</strong>
          <span>Chrome Extension · v1.7.1</span>
        </div>
      </div>
      <p>Extension tự chạy trên trang WFX. Mở panel bằng nút nổi hoặc <kbd>Ctrl + Alt + X</kbd>.</p>
      <button id="open-wfx" type="button">Mở WFX</button>
      <small>Thiết lập được lưu riêng trong Chrome Extension. Có thể gán thêm phím tại chrome://extensions/shortcuts.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
