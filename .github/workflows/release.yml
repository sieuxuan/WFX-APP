name: Publish WFX Smart Stable Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        # actions/checkout v5 (Node 24) — pin full SHA để action là immutable.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6 (Node 24) — pin full SHA.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m ruff check .
          python -m pip_audit -r requirements.txt
          python -m pytest -q

      - name: Prepare Windows signing identity
        shell: powershell
        env:
          WFX_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WFX_SIGNING_CERTIFICATE_BASE64 }}
          WFX_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WFX_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WFX_SIGNING_CERTIFICATE_BASE64)) {
            throw "Thiếu secret WFX_SIGNING_CERTIFICATE_BASE64."
          }
          if ([string]::IsNullOrWhiteSpace($env:WFX_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Thiếu secret WFX_SIGNING_CERTIFICATE_PASSWORD."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "wfx-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certPath,
            [Convert]::FromBase64String($env:WFX_SIGNING_CERTIFICATE_BASE64)
          )
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certPath,
            $env:WFX_SIGNING_CERTIFICATE_PASSWORD
          )
          $thumbprint = (
            $certificate.Thumbprint -replace '[^A-Fa-f0-9]', ''
          ).ToUpperInvariant()
          if ($thumbprint -notmatch '^[A-F0-9]{40}$') {
            throw "Certificate ký Windows không có thumbprint hợp lệ."
          }
          @"
          """Danh tính certificate được workflow release tạo tự động."""

          EXPECTED_SIGNER_THUMBPRINT = "$thumbprint"
          "@ | Set-Content -LiteralPath "wfx_panel/_signing_identity.py" -Encoding UTF8

      - name: Build Windows app
        shell: powershell
        run: |
          python wfx_panel/assets/generate_icon.py
          python -m PyInstaller --noconfirm --clean wfx_panel/wfx-panel.spec
          $buildRoot = Join-Path $PWD "dist/WFX-Panel"
          $buildBytes = (
            Get-ChildItem -LiteralPath $buildRoot -Recurse -File |
              Measure-Object -Property Length -Sum
          ).Sum
          $buildSizeMb = [math]::Round($buildBytes / 1MB, 1)
          Write-Host "Packaged size: $buildSizeMb MB"
          if ($buildSizeMb -gt 180) {
            throw "Bản đóng gói vượt giới hạn 180 MB."
          }
          foreach ($unused in @("PyQt5", "PyQt6", "numpy", "cryptography")) {
            if (
              Test-Path -LiteralPath (
                Join-Path $buildRoot "_internal/$unused"
              )
            ) {
              throw "Bản đóng gói còn dependency không dùng: $unused"
            }
          }

      - name: Sign, package and create signed checksum
        id: package
        shell: powershell
        env:
          WFX_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WFX_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "wfx-signing.pfx"
          $publicCertPath = Join-Path $env:RUNNER_TEMP "wfx-signing.cer"
          $thumbprint = $null
          try {
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certPath,
              $env:WFX_SIGNING_CERTIFICATE_PASSWORD
            )
            $thumbprint = (
              $certificate.Thumbprint -replace '[^A-Fa-f0-9]', ''
            ).ToUpperInvariant()
            [IO.File]::WriteAllBytes(
              $publicCertPath,
              $certificate.Export(
                [Security.Cryptography.X509Certificates.X509ContentType]::Cert
              )
            )
            # Runner là máy tạm. Chỉ trust publisher root trong job để signtool
            # kiểm tra đầy đủ Authenticode; cuối step sẽ gỡ certificate này.
            Import-Certificate `
              -FilePath $publicCertPath `
              -CertStoreLocation "Cert:\CurrentUser\Root" |
                Out-Null

            $exePath = Join-Path $PWD "dist/WFX-Panel/WFX-Panel.exe"
            & signtool sign /fd SHA256 /td SHA256 `
              /tr "http://timestamp.digicert.com" `
              /f $certPath /p $env:WFX_SIGNING_CERTIFICATE_PASSWORD `
              $exePath
            if ($LASTEXITCODE -ne 0) {
              throw "Không ký được WFX-Panel.exe."
            }
            & signtool verify /pa /all $exePath
            if ($LASTEXITCODE -ne 0) {
              throw "Chữ ký WFX-Panel.exe không hợp lệ."
            }
            $authenticode = Get-AuthenticodeSignature -LiteralPath $exePath
            $actualExeSigner = (
              $authenticode.SignerCertificate.Thumbprint -replace '[^A-Fa-f0-9]', ''
            ).ToUpperInvariant()
            if ($actualExeSigner -ne $thumbprint) {
              throw "EXE không được ký bằng đúng publisher certificate."
            }
            if (-not $authenticode.TimeStamperCertificate) {
              throw "EXE chưa có timestamp."
            }

            $version = python -c "from wfx_panel.version import APP_VERSION; print(APP_VERSION)"
            $tag = "v$version"
            if (
              $env:GITHUB_REF_TYPE -eq "tag" -and
              $env:GITHUB_REF_NAME -ne $tag
            ) {
              throw (
                "Tag $env:GITHUB_REF_NAME không khớp APP_VERSION $version."
              )
            }
            # Prefix mới cố ý không tương thích updater <= 1.0.8. Bản cũ có
            # thể xóa cả thư mục chứa EXE; người dùng nâng cấp 1.0.9 thủ công
            # một lần, rồi các bản sau dùng updater an toàn.
            $zipName = "WFX-Smart-v$version-win64.zip"
            $zipPath = Join-Path $PWD $zipName
            $checksumPath = "$zipPath.sha256"
            $signaturePath = "$checksumPath.p7s"
            # bsdtar của Windows runner nén cây PyInstaller nhanh và ổn định
            # hơn Compress-Archive rất nhiều.
            & tar.exe -a -c -f $zipPath `
              -C (Join-Path $PWD "dist/WFX-Panel") .
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $zipPath)) {
              throw "Không tạo được gói ZIP phát hành."
            }
            $archiveEntries = @(& tar.exe -tf $zipPath)
            if (
              $LASTEXITCODE -ne 0 -or
              $archiveEntries -notcontains "./WFX-Panel.exe" -or
              -not ($archiveEntries | Where-Object {
                $_ -like "./_internal/*"
              })
            ) {
              throw "Gói ZIP thiếu WFX-Panel.exe hoặc _internal."
            }
            $hash = (
              Get-FileHash -LiteralPath $zipPath -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(
              $checksumPath,
              "$hash  $zipName`n",
              [Text.UTF8Encoding]::new($false)
            )

            Add-Type -AssemblyName System.Security.Cryptography.Pkcs
            $content = [Security.Cryptography.Pkcs.ContentInfo]::new(
              [IO.File]::ReadAllBytes($checksumPath)
            )
            $cms = [Security.Cryptography.Pkcs.SignedCms]::new($content, $true)
            $signer = [Security.Cryptography.Pkcs.CmsSigner]::new($certificate)
            $signer.IncludeOption = (
              [Security.Cryptography.X509Certificates.X509IncludeOption]::WholeChain
            )
            $cms.ComputeSignature($signer)
            [IO.File]::WriteAllBytes($signaturePath, $cms.Encode())

            $verifyCms = [Security.Cryptography.Pkcs.SignedCms]::new(
              $content,
              $true
            )
            $verifyCms.Decode([IO.File]::ReadAllBytes($signaturePath))
            $verifyCms.CheckSignature($false)

            "VERSION=$version" >> $env:GITHUB_ENV
            "TAG=$tag" >> $env:GITHUB_ENV
            "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          }
          finally {
            if ($thumbprint) {
              Remove-Item `
                -LiteralPath "Cert:\CurrentUser\Root\$thumbprint" `
                -Force `
                -ErrorAction SilentlyContinue
            }
            Remove-Item `
              -LiteralPath $certPath, $publicCertPath `
              -Force `
              -ErrorAction SilentlyContinue
          }

      - name: Publish GitHub Release
        # softprops/action-gh-release v2 — pin SHA vì action nhận contents:write.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            ${{ env.ZIP_NAME }}.sha256.p7s
          tag_name: ${{ env.TAG }}
          name: WFX Smart ${{ env.VERSION }}
          body: |
            WFX Smart ${{ env.VERSION }} nâng cấp Catalog và độ ổn định của ứng dụng desktop.

            Cách cài:
            1. Tải file **${{ env.ZIP_NAME }}** bên dưới.
            2. Giải nén vào một thư mục riêng (không chép đè bản 1.0.8).
            3. Mở **WFX-Panel.exe**.

            **Lưu ý khi nâng cấp từ 1.0.8 trở xuống:** hãy cài thủ công một lần
            theo ba bước trên. Gói 1.0.9 cố ý không kích hoạt updater cũ để tránh
            nguy cơ updater đó xóa nhầm thư mục chứa ứng dụng. Từ 1.0.9 trở đi,
            cập nhật tự động đã được ký số, giới hạn file được thay và có rollback.

            Điểm chính:
            - Catalog Apparel tự nhận diện cây Group/Folder theo tài khoản.
            - Cây Catalog chỉ scan lần đầu, được dùng lại sau khi mở lại app; Refresh mới ép scan lại.
            - Group, Folder và Master đều có thể đặt làm vị trí mặc định.
            - Tìm Style Code/Buyer Reference và mở thẳng Costing/BOM trong một thao tác.
            - Không chạy chồng hai workflow WFX; UI báo tiến trình và vẫn cho phép đóng/thu panel.
            - Toast nhỏ gọn, hiện chữ đồng bộ và không làm nghẽn WebView.
            - Launcher, panel, tray, taskbar và nhiều màn hình tiếp tục hoạt động ổn định.
            - Trình cập nhật chỉ thay file của WFX Smart và có rollback an toàn.

            File `.sha256` và chữ ký `.p7s` xác minh gói tải về đúng từ nhà phát hành.
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
