name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Bám requires-python>=3.11 trong pyproject: chạy cả biên dưới (3.11) và
        # biên hiện dùng (3.12) để bắt lỗi khác biệt giữa hai phiên bản.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout source
        # checkout v5 chạy Node 24; pin full SHA để action immutable.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        # setup-python v6 chạy Node 24; pin full SHA.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Test (pytest)
        run: python -m pytest
