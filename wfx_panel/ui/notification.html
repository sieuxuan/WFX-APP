<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WFX Smart Notification</title>
  <link rel="stylesheet" href="notification.css?v=20260728-2" />
</head>
<body>
  <main class="notification notification-success" role="status" aria-live="polite">
    <span class="notification-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4V7Z"/><path d="m9 14 2 2 4-5"/></svg>
    </span>
    <span class="notification-copy">
      <strong class="notification-title">Đã hoàn thành</strong>
      <span class="notification-message">Tác vụ WFX đã hoàn tất.</span>
      <span class="notification-detail" hidden></span>
    </span>
    <button class="notification-close" type="button" aria-label="Đóng thông báo">
      <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg>
    </button>
  </main>
  <script src="notification.js"></script>
</body>
</html>
